<!DOCTYPE html>
<html>
<head>
    <title>Custom Login</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
        }

        .login-box {
            width: 350px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Login</h2>

<form method="post" action="/perform-login">
	
        <input type="text"
               name="username"
               placeholder="Enter Username" />

        <input type="password"
               name="password"
               placeholder="Enter Password" />

        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>
