spring.application.name=user-service
# Server Port (optional)
server.port=7070

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/user_service_security
#spring.datasource.url=jdbc:mysql://host.docker.internal:3306/user_service
spring.datasource.username=root
spring.datasource.password=root
my.name=Rutuja
# MySQL Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration (JPA)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Format SQL (optional)
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.springframework.security=DEBUG

# ================= PUBLIC URLS =================

jwt.secret=mysecretkeymysecretkeymysecretkey123456

security.public.urls=/custom-login,/perform-login,/oauth2/**,/css/**,/error

security.rules=GET:/users/findAll:ADMIN,STAFF;GET:/users/search/**:ADMIN;POST:/users/save:ADMIN;PUT:/users/update/**:ADMIN;DELETE:/users/delete/**:ADMIN
